/* v0.2.2 — overflow / responsive hardening */
.main, #view, .hero, .page, .panel, .document-body, .record-row > *, .profile-lines, .page-head, .meta-card { min-width: 0; }

  width: 100%;
  max-width: 100%;
  margin-inline: auto;
  font-size: clamp(34px, 4.35vw, 58px);

.hero h2 span { color: #9db9ef; }

  max-width: 100%;

}

    fileName,

function parseArchiveImageBlock(line=''){

async function archiveImageFileToBlob(file){

  if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('JPG, PNG, WebP 이미지만 사용할 수 있어.');
  if(file.size>20*1024*1024)throw new Error('원본 이미지는 20MB 이하만 사용할 수 있어.');

    const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('이미지를 읽지 못했어.'));im.src=url});

function markdownToHtml(v='',redactions=new Map()){
  const lines=String(v||'').replace(/\r\n?/g,'\n').split('\n');
  let out='',para=[],list=[];
  const flushPara=()=>{if(para.length){out+=`<p>${para.map(x=>inlineMarkdown(x,redactions)).join('<br>')}</p>`;para=[]}};
  const flushList=()=>{if(list.length){out+='<ul>'+list.map(x=>`<li>${inlineMarkdown(x,redactions)}</li>`).join('')+'</ul>';list=[]}};
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(!line.trim()){flushPara();flushList();continue;}
    const imageBlock=parseArchiveImageBlock(line);if(imageBlock){flushPara();flushList();out+=archiveImageHtml(imageBlock);continue;}
    const h=line.match(/^(#{2,4})\s+(.+)$/);if(h){flushPara();flushList();const n=Math.min(4,h[1].length+1);out+=`<h${n}>${inlineMarkdown(h[2],redactions)}</h${n}>`;continue;}

      while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,''));i++;}i--;

    }
    const li=line.match(/^[-*]\s+(.+)$/);if(li){flushPara();list.push(li[1]);continue;}
    flushList();para.push(line);
  }
  flushPara();flushList();return out;
}

  if(res.status===401&&auth&&state.session?.refresh_token){const ok=await refreshSession();if(ok)return rawFetch(path,{method,body,auth,headers});}
  if(!res.ok){const message=data?.message||data?.msg||data?.error_description||data?.hint||('HTTP '+res.status);const err=new Error(message);err.status=res.status;err.data=data;throw err}
  return data;
}

iv>`;

async function loadOnlineMembers(){
  try{return await rpc('archive_online_members_v2')}catch(e){console.warn('online members failed',e);return []}
}
async function loadArchiveChat(){
  try{
    const rows=await restQuery('archive_chat_messages','select=id,sender_code,body,created_at&order=created_at.desc&limit=100');
    return Array.isArray(rows)?rows.reverse():[];
  }catch(e){console.warn('archive chat failed',e);return []}
}
function onlineRoleText(row){
  const base=roleNames[row.role]||row.role;
  if(row.role==='archivist')return `${base} · ${row.access_level}급`;
  if(row.role==='chief')return `${base} · 3급`;
  return base;
}
function paintOnlineMembers(rows){
  const box=$('#onlineMembers');if(!box)return;
  const count=$('#onlineCount');if(count)count.textContent=String(rows.length);
  box.innerHTML=rows.length?rows.map(x=>{
    const mine=x.member_code===state.member?.member_code;
    return `<div class="online-member"><div class="online-code ${mine?'online-me':''}">${escapeHTML(x.nickname?`${x.member_code} · ${x.nickname}`:x.member_code)}${mine?' · YOU':''}<span class="role-chip-small">${escapeHTML(onlineRoleText(x))}</span></div><div class="online-meta">최근 신호 ${escapeHTML(fmtDate(x.last_seen))}</div></div>`;
  }).join(''):'<div class="empty-small">현재 확인되는 접속자가 없습니다.</div>';
}
function paintArchiveChat(rows,forceBottom=false){
  const box=$('#archiveChat');if(!box)return;
  const oldHeight=box.scrollHeight, oldTop=box.scrollTop, oldClient=box.clientHeight;
  const bottomGap=Math.max(0,oldHeight-oldTop-oldClient);
  const stick=forceBottom||bottomGap<90||oldHeight===0;
  box.innerHTML=rows.length?rows.map(m=>{
    const mine=m.sender_code===state.member?.member_code;
    return `<div class="archive-chat-msg ${mine?'mine':''}"><div class="archive-chat-who">${escapeHTML(memberLabelByCode(m.sender_code))}${mine?' · YOU':''}</div><div class="archive-chat-body">${escapeHTML(m.body)}</div><div class="archive-chat-time">${escapeHTML(fmtDate(m.created_at))}</div></div>`;
  }).join(''):'<div class="empty-small">아직 통신 기록이 없습니다.</div>';
  requestAnimationFrame(()=>{
    if(stick)box.scrollTop=box.scrollHeight;
    else box.scrollTop=Math.max(0,box.scrollHeight-box.clientHeight-bottomGap);
  });
}
async function refreshComms(forceBottom=false){
  if(state.route!=='comms')return;
  const [online,messages]=await Promise.all([loadOnlineMembers(),loadArchiveChat(),ensureMemberLabels()]).then(([a,b])=>[a,b]);
  if(state.route!=='comms')return;
  paintOnlineMembers(online||[]);
  paintArchiveChat(messages||[],forceBottom);
}
async function sendArchiveChat(){
  const input=$('#archiveChatInput'),st=$('#archiveChatStatus');

  const body=input.value.trim();

async function loadMarkdownFile(file){
  const st=$('#mdLoadStatus');st.textContent='MD 분석 중...';st.className='status-msg';

    if(!file.name.toLowerCase().endsWith('.md'))throw new Error('.md 파일만 가져올 수 있습니다.');
    if(file.size>2*1024*1024)throw new Error('MD 파일은 2MB 이하만 가져올 수 있습니다.');
    const text=await file.text();
    const draft=parseArchiveMarkdown(text,file.name);
    if(draft.document.min_access_level>state.member.access_level)throw new Error(`이 문서는 ${draft.document.min_access_level}급으로 설정되어 있지만 현재 계정 권한보다 높습니다.`);
    state.mdDraft=draft;st.textContent='분석 완료';st.className='status-msg ok';
    $('#mdFileChip').innerHTML=`<span class="file-chip">${escapeHTML(file.name)} · ${(file.size/1024).toFixed(1)} KB</span>`;
    renderMarkdownPreview();
  }catch(e){state.mdDraft=null;st.textContent=e.message||'MD 분석에 실패했습니다.';st.className='status-msg error';$('#mdPreview').classList.add('hidden')}
}

async function importMarkdownDraft(){
  const draft=state.mdDraft,st=$('#mdImportStatus');if(!draft||!st)return;
  const [accessClass,levelRaw]=$('#mdAccess').value.split(':');
  const document={...draft.document,archive_code:$('#mdArchiveCode').value.trim().toUpperCase()||null,title:$('#mdTitle').value.trim(),title_en:$('#mdTitleEn').value.trim()||null,category:$('#mdCategory').value,access_class:accessClass,min_access_level:Number(levelRaw),record_status:$('#mdStatus').value,summary:$('#mdSummary').value.trim(),primary_world:$('#mdWorld').value.trim()||null};
  if(!document.title){st.textContent='제목이 필요합니다.';st.className='status-msg error';return;}
  const sections=draft.sections.map(s=>({...s,min_access_level:Math.max(Number(levelRaw),Number(s.min_access_level||0))}));
  let lorePatch=null;
  try{if(state.member.role==='chief'){const author=readLoreAuthor('mdLoreAuthor','mdLoreAuthorCustom'),date=readLoreDate('mdLore');validateLoreAuthorDate(author,date);lorePatch={lore_author_profile_id:author.profile_id,lore_author_name:author.name,lore_year:date.year,lore_month:date.month,lore_day:date.day}}}catch(e){st.textContent=loreErrorMessage(e);st.className='status-msg error';return}
  const btn=$('#importMdBtn');btn.disabled=true;st.textContent='기록망에 MD 등록 중...';st.className='status-msg';
  try{
    const result=await rpc('import_archive_markdown',{p_document:document,p_sections:sections});
    if(!result?.ok)throw new Error('MD 등록 결과를 확인할 수 없습니다.');
    if(lorePatch)await restPatch('archive_documents',`id=eq.${encodeURIComponent(result.document_id)}`,lorePatch);
    st.textContent=`등록 완료 · ${result.archive_code} · 섹션 ${result.section_count}개 · 검열 ${result.redaction_count}개`;st.className='status-msg ok';
    await loadDocuments();setTimeout(()=>openDocument(result.document_id),350);
  }catch(e){st.textContent=loreErrorMessage(e)||'MD 등록에 실패했습니다.';st.className='status-msg error'}finally{btn.disabled=false}
}

async function createDocument(e){e.preventDefault();const st=$('#createStatus');st.textContent='기록 등록 중...';st.className='status-msg';const level=Number($('#docLevel').value);const payload={archive_code:$('#docCode').value.trim().toUpperCase(),title:$('#docTitle').value.trim(),title_en:$('#docTitleEn').value.trim()||null,category:$('#docCategory').value,access_class:level===0?'public':'restricted',min_access_level:level,record_status:$('#docStatus').value,summary:$('#docSummary').value.trim(),primary_world:$('#docWorld').value.trim()||null};try{if(state.member.role==='chief'){const author=readLoreAuthor('docLoreAuthor','docLoreAuthorCustom'),date=readLoreDate('docLore');validateLoreAuthorDate(author,date);Object.assign(payload,{lore_author_profile_id:author.profile_id,lore_author_name:author.name,lore_year:date.year,lore_month:date.month,lore_day:date.day})}const rows=await restInsert('archive_documents',payload);const d=rows[0];const body=$('#docBody').value.trim();if(body)await restInsert('archive_document_sections',{document_id:d.id,heading:'개요',body,sort_order:10,min_access_level:level});await restInsert('archive_document_revisions',{document_id:d.id,change_summary:'문서 생성',snapshot:payload});await loadDocuments();st.textContent='등록 완료';st.className='status-msg ok';setTimeout(()=>openDocument(d.id),250)}catch(err){st.textContent=loreErrorMessage(err);st.className='status-msg error'}}
async function syncNow(){const btn=$('#refreshBtn');btn.textContent='동기화 중…';try{await loadMember();if(!state.member)return showDenied();await Promise.all([loadDocuments(),loadMemberLabels()]);applyMemberUI();renderHome()}catch(e){alert('동기화 실패: '+e.message)}finally{btn.textContent='동기화'}}
function route(name){closeMobileSidebar();if(name!=='comms')stopCommsPolling();state.route=name;$$('.nav-item').forEach(x=>x.classList.remove('active'));const active=document.querySelector(`[data-route="${name}"]`);if(active)active.classList.add('active');if(name==='home')renderHome();else if(name==='recent')renderRecent();else if(name==='random'){if(state.documents.length)openDocument(state.documents[Math.floor(Math.random()*state.documents.length)].id);else renderHome()}else if(name==='create')renderCreate();else if(name==='comms')renderComms();else if(name==='archivists')renderArchivists()}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();if(state.busy)return;state.busy=true;$('#loginBtn').disabled=true;setLoginStatus('계정 인증 중...');try{await signIn($('#email').value.trim(),$('#password').value);await loadMember();if(!state.member){showDenied();return}await Promise.all([loadDocuments(),loadMemberLabels()]);$('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden');applyMemberUI();renderHome()}catch(err){console.error(err);saveSession(null);setLoginStatus(err.message||'로그인에 실패했습니다.','error')}finally{state.busy=false;$('#loginBtn').disabled=false}});
$$('[data-route]').forEach(b=>b.addEventListener('click',()=>route(b.dataset.route)));$$('[data-category]').forEach(b=>b.addEventListener('click',()=>renderCategory(b.dataset.category)));$('#profileBtn').onclick=()=>{closeMobileSidebar();renderProfile()};$('#logoutBtn').onclick=signOut;$('#refreshBtn').onclick=syncNow;
$('#mobileMenuBtn').onclick=toggleMobileSidebar;$('#sidebarOverlay').onclick=closeMobileSidebar;window.addEventListener('resize',()=>{if(innerWidth>620)closeMobileSidebar()});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMobileSidebar()});
window.addEventListener('unhandledrejection',e=>console.error('PLANK UNHANDLED',e.reason));bootstrap();
</script>
</body></html>
