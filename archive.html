<style>

.field-label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 7px; }

.locked-block { padding: 18px; border: 1px dashed #6d3b45; background: #1a1014; color: #df9ca6; font: 12px ui-monospace, monospace; margin: 15px 0; }

function parseArchiveMarkdown(text,fileName='record.md'){

        const m=line.match(/^([A-Za-z_][A-Za-z0-9_-]*)\s*:\s*(.*)$/);
        if(m)meta[m[1].toLowerCase()]=stripYamlValue(m[2]);

  const baseName=fileName.replace(/\.md$/i,'').trim()||'새 기록';
  const title=(meta.title||baseName).trim();
  const category=normalizeCategory(meta.category||'DOCUMENT');

function inlineMarkdown(v='',redactions=new Map()){

    return `<span class="redaction-block" aria-label="검열됨">${'█'.repeat(Math.max(3,Math.min(24,Number(len)||6)))}</span>`;
  });

function parseArchiveImageBlock(line=''){
  const m=String(line||'').trim().match(/^\{\{image\|([\s\S]+)\}\}$/i);

  const data={src:'',path:'',pending:'',width:72,align:'center',rotate:0,caption:''};
  for(const part of m[1].split('|')){
    const eq=part.indexOf('=');if(eq<1)continue;
    const key=part.slice(0,eq).trim().toLowerCase(),raw=part.slice(eq+1).trim();
    if(key==='src')data.src=raw;

    else if(key==='pending')data.pending=raw;
    else if(key==='width')data.width=Math.max(25,Math.min(100,Number(raw)||72));
    else if(key==='align'&&['left','center','right'].includes(raw))data.align=raw;
    else if(key==='rotate')data.rotate=Math.max(-15,Math.min(15,Number(raw)||0));
    else if(key==='caption'){try{data.caption=decodeURIComponent(raw)}catch(e){data.caption=raw}}

  const pending=/^[A-Za-z0-9_-]{8,80}$/.test(data.pending);
  if(!oldData&&!storedPath&&!pending)return null;
  return data;
}

function buildArchiveImageBlock(ref,{width=72,align='center',rotate=0,caption=''}={}){

async function archiveImageFileToBlob(file){
  if(!file)throw new Error('이미지 파일을 선택해줘.');
  if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('JPG, PNG, WebP 이미지만 사용할 수 있어.');
  if(file.size>20*1024*1024)throw new Error('원본 이미지는 20MB 이하만 사용할 수 있어.');
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('이미지를 읽지 못했어.'));im.src=url});
    const maxEdge=2200,ratio=Math.min(1,maxEdge/Math.max(img.naturalWidth,img.naturalHeight));
    let w=Math.max(1,Math.round(img.naturalWidth*ratio)),h=Math.max(1,Math.round(img.naturalHeight*ratio));
    let quality=.9,blob=null;
    for(let attempt=0;attempt<7;attempt++){
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d',{alpha:true});ctx.drawImage(img,0,0,w,h);
      blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality));
      if(!blob)blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
      if(blob&&blob.size<=2*1024*1024)break;
      quality=Math.max(.58,quality-.07);w=Math.max(1,Math.round(w*.9));h=Math.max(1,Math.round(h*.9));
    }
    if(!blob)throw new Error('이미지 압축에 실패했어.');
    if(blob.size>4.5*1024*1024)throw new Error('압축 후에도 이미지가 너무 커. 더 작은 사진을 선택해줘.');
    return blob;
  }finally{URL.revokeObjectURL(url)}
}

function markdownToHtml(v='',redactions=new Map()){

function paintArchiveChat(rows,forceBottom=false){
  const box=$('#archiveChat');if(!box)return;
  const oldHeight=box.scrollHeight, oldTop=box.scrollTop, oldClient=box.clientHeight;
  const bottomGap=Math.max(0,oldHeight-oldTop-oldClient);
  const stick=forceBottom||bottomGap<90||oldHeight===0;
  box.innerHTML=rows.length?rows.map(m=>{
    const mine=m.sender_code===state.member?.member_code;
    return `<div class="archive-chat-msg ${mine?'mine':''}"><div class="archive-chat-who">${escapeHTML(memberLabelByCode(m.sender_code))}${mine?' · YOU':''}</div><div class="archive-chat-body">${escapeHTML(m.body)}</div><div class="archive-chat-time">${escapeHTML(fmtDate(m.created_at))}</div></div>`;
  }).join(''):'<div class="empty-small">아직 통신 기록이 없습니다.</div>';
  requestAnimationFrame(()=>{
    if(stick)box.scrollTop=box.scrollHeight;
    else box.scrollTop=Math.max(0,box.scrollHeight-box.clientHeight-bottomGap);
  });
}
async function refreshComms(forceBottom=false){

}
async function sendArchiveChat(){

}

function yamlScalar(v=''){
  const x=String(v).trim();if(!x)return '';

  if(/^(true|false)$/i.test(x))return x.toLowerCase()==='true';
  if(/^(null|~)$/i.test(x))return null;
  if(/^-?\d+(?:\.\d+)?$/.test(x))return Number(x);
  return x;
}
function parseSimpleFrontmatter(text=''){

  const head=src.slice(4,end);src=src.slice(end+5);let current='';
  for(const line of head.split('\n')){
    const item=line.match(/^\s+-\s*(.+)$/);if(item&&current){if(!Array.isArray(frontmatter[current]))frontmatter[current]=frontmatter[current]===''?[]:[frontmatter[current]];frontmatter[current].push(yamlScalar(item[1]));continue}
    const m=line.match(/^([^:#][^:]*)\s*:\s*(.*)$/);if(!m)continue;
    current=m[1].trim();const val=m[2].trim();frontmatter[current]=val?yamlScalar(val):[];
  }
  return {frontmatter,body:src};
}

  if(top==='03_장소')return 'LOCATION';
  if(top==='04_역사'){
    if(seg.includes('03_중요인물'))return 'ENTITY';

  return 'DOCUMENT';
}

async function importObsidianVaultDraft(){
  const d=state.obsidianDraft,st=$('#obsidianImportStatus'),btn=$('#importObsidianBtn');if(!d||!st||!btn)return;
  const chosen=d.records.filter(x=>x.selected);if(!chosen.length){st.textContent='가져올 기록을 하나 이상 선택해줘.';st.className='status-msg error';return}
  if(chosen.some(x=>x.duplicate)){if(!confirm('기존 기록과 제목이 같은 문서가 선택되어 있어. 별도 기록으로 추가할까?'))return}

    batchId=begin?.batch_id;if(!batchId)throw new Error('이전 배치를 만들지 못했습니다.');
    const payload=chosen.map(r=>({document:r.document,sections:r.sections,import_meta:{source_path:r.sourcePath,source_format:'obsidian-markdown',source_hash:r.sourceHash,frontmatter:r.frontmatter},wikilinks:r.wikilinks,aliases:r.aliases,tags:r.tags}));
    st.textContent=`기록 ${chosen.length.toLocaleString()}건을 원자적 배치로 등록 중...`;bar.style.width='18%';
    const imported=await rpc('import_archive_obsidian_batch',{p_batch_id:batchId,p_records:payload});if(!imported?.ok)throw new Error('일괄 등록 결과를 확인할 수 없습니다.');
    const resultMap=new Map((imported.documents||[]).map(x=>[x.source_path,x]));bar.style.width='58%';
    const imageDocs=chosen.filter(x=>x.images.length);let imageDone=0,totalImages=imageDocs.reduce((n,x)=>n+x.images.length,0);
    for(const r of imageDocs){const info=resultMap.get(r.sourcePath);if(!info?.document_id)continue;const replacements=new Map();
      for(const img of r.images){const entry=d.zip.files[img.asset_path];if(!entry)throw new Error(`이미지 파일을 찾을 수 없습니다: ${img.original_target}`);const raw=await entry.async('blob'),fileObj=new File([raw],img.original_target,{type:imageMimeFromName(img.original_target)}),compressed=await archiveImageFileToBlob(fileObj),path=await uploadArchiveImage(info.document_id,compressed);replacements.set(img.pending_id,path);imageDone++;st.textContent=`이미지 이전 중... ${imageDone}/${totalImages}`;bar.style.width=`${58+Math.round((imageDone/Math.max(totalImages,1))*25)}%`}
      if(replacements.size){const sections=await restQuery('archive_document_sections',`select=id,heading,body,sort_order,min_access_level&document_id=eq.${encodeURIComponent(info.document_id)}&order=sort_order.asc`);for(const sec of sections){for(const [pending,path] of replacements)sec.body=String(sec.body||'').replaceAll(`pending=${pending}`,`path=${path}`)}await rpc('update_archive_document',{p_document_id:info.document_id,p_document:r.document,p_sections:sections,p_change_summary:'Obsidian 이미지 임베드 이전'})}
    }
    st.textContent='문서 참조 연결 중...';bar.style.width='88%';const resolved=await rpc('resolve_archive_wikilinks',{p_batch_id:batchId});
    await rpc('finish_archive_obsidian_import',{p_batch_id:batchId,p_status:'completed',p_stats:{documents:chosen.length,wikilinks:totalWiki,images:totalImages,resolved_links:resolved?.resolved||0,unresolved_links:resolved?.unresolved||0,vault_hash:d.vaultHash||null,zip_size_bytes:d.file.size}});bar.style.width='100%';
    const doneMsg=`Vault 이전 완료 · ${chosen.length.toLocaleString()}건 · 연결 ${resolved?.resolved||0}건 · 미작성 참조 ${resolved?.unresolved||0}건`;
    completed=true;state.obsidianDraft=null;await loadDocuments();renderSearch('',doneMsg);
  }catch(e){st.textContent=`이전 중 오류: ${loreErrorMessage(e)}${batchId?' · 생성된 배치는 롤백할 수 있습니다.':''}`;st.className='status-msg error';if(batchId){const rb=document.createElement('button');rb.type='button';rb.className='small-btn danger';rb.style.marginTop='8px';rb.textContent='이 배치의 DB 기록 롤백';rb.onclick=async()=>{if(!confirm('이 가져오기 배치에서 생성된 문서를 모두 삭제할까요?'))return;rb.disabled=true;try{const res=await rpc('rollback_archive_obsidian_import',{p_batch_id:batchId});st.textContent=`롤백 완료 · 삭제된 문서 ${res.deleted_documents||0}건`;st.className='status-msg ok';await loadDocuments()}catch(err){st.textContent=loreErrorMessage(err);st.className='status-msg error'}};st.appendChild(document.createElement('br'));st.appendChild(rb)}}finally{if(!completed&&btn){btn.disabled=false;btn.textContent=originalBtnText;$$('[data-obsidian-select],#obsidianSelectAll,#obsidianSkipEmpty,#obsidianSafeSelect,#clearObsidianDraft').forEach(x=>x.disabled=false)}}

async function loadMarkdownFile(file){
  const st=$('#mdLoadStatus');st.textContent='MD 분석 중...';st.className='status-msg';
  try{
    if(!file.name.toLowerCase().endsWith('.md'))throw new Error('.md 파일만 가져올 수 있습니다.');
    if(file.size>2*1024*1024)throw new Error('MD 파일은 2MB 이하만 가져올 수 있습니다.');
    const text=await file.text();
    const draft=parseArchiveMarkdown(text,file.name);
    if(draft.document.min_access_level>state.member.access_level)throw new Error(`이 문서는 ${draft.document.min_access_level}급으로 설정되어 있지만 현재 계정 권한보다 높습니다.`);
    state.mdDraft=draft;st.textContent='분석 완료';st.className='status-msg ok';
    $('#mdFileChip').innerHTML=`<span class="file-chip">${escapeHTML(file.name)} · ${(file.size/1024).toFixed(1)} KB</span>`;
    renderMarkdownPreview();
  }catch(e){state.mdDraft=null;st.textContent=e.message||'MD 분석에 실패했습니다.';st.className='status-msg error';$('#mdPreview').classList.add('hidden')}
}

async function importMarkdownDraft(){
