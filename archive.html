.field-label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 7px; }

.redacted { display: inline-block; background: #020304; color: #020304; border-radius: 2px; user-select: none; letter-spacing: .1em; }

/* v0.2.2 — overflow / responsive hardening */
.main, #view, .hero, .page, .panel, .document-body, .record-row > *, .profile-lines, .page-head, .meta-card { min-width: 0; }
#view { width: 100%; overflow-x: hidden; }
.hero { width: 100%; max-width: 980px; padding-inline: 4px; }
.hero h2 {
  width: 100%;
  max-width: 100%;
  margin-inline: auto;
  font-size: clamp(34px, 4.35vw, 58px);
  line-height: 1.08;
  letter-spacing: -.04em;
  text-wrap: balance;
  overflow-wrap: break-word;
  word-break: keep-all;
}
.hero h2 span { color: #9db9ef; }
.page-head h1, .record-title, .record-summary, .profile-lines b, .profile-lines small, .notice-title, .meta-row b {
  max-width: 100%;
  overflow-wrap: anywhere;
}
.page-head h1 { word-break: keep-all; text-wrap: balance; }
.record-row { min-width: 0; }
.record-summary { min-width: 0; }
.search-box, .system-banner, .dashboard-grid { width: 100%; max-width: 1180px; }
@media (max-width: 1180px) {
  .hero h2 { font-size: clamp(32px, 4.8vw, 52px); }
  #view { padding-inline: clamp(18px, 3vw, 38px); }
}
@media (max-width: 760px) {
  .hero h2 { font-size: clamp(30px, 8vw, 44px); }
  .hero { margin-top: 12px; }
}

<script>
'use strict';
const SUPABASE_URL='https://zkmxtvompqzhyfbrnupc.supabase.co';
const SUPABASE_KEY='sb_publishable_yqodOC8pokdJmOthqsuA1Q_WZjlI0Xg';
const memStore=new Map();
const safeStore={
  get(k){try{return localStorage.getItem(k)}catch(e){return memStore.get(k)||null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){memStore.set(k,v)}},
  remove(k){try{localStorage.removeItem(k)}catch(e){memStore.delete(k)}}
};
const SESSION_KEY='plang_archive_session_v02';
const ANINOTE_SESSION_KEY='sb-zkmxtvompqzhyfbrnupc-auth-token';
const FROM_ANINOTE=new URLSearchParams(location.search).get('from')==='aninote';
const state={session:null,user:null,member:null,documents:[],route:'home',busy:false,mdDraft:null};
let guestExpiryTimer=null;
let presenceTimer=null;
let commsTimer=null;
const categoryNames={WORLD:'세계',ENTITY:'존재',LOCATION:'장소',EVENT:'사건',OBJECT:'물품',ORGANIZATION:'조직',CONCEPT:'개념',PHENOMENON:'현상',DOCUMENT:'문서'};
const categoryPrefixes={WORLD:'WLD',ENTITY:'ENT',LOCATION:'LOC',EVENT:'EVT',OBJECT:'OBJ',ORGANIZATION:'ORG',CONCEPT:'CON',PHENOMENON:'PHN',DOCUMENT:'DOC'};
const accessNames={0:'공개',1:'제한 1급',2:'제한 2급',3:'제한 3급'};
const roleNames={guest:'손님',reader:'열람자',archivist:'기록관',chief:'최고기록관리자'};
const statusNames={confirmed:'확인',observing:'관측 중',investigating:'조사 중',incomplete:'불완전',damaged:'손상',lost:'분실',disputed:'논쟁 중',sealed:'봉인'};
function $(s){return document.querySelector(s)}
function $$(s){return [...document.querySelectorAll(s)]}
function escapeHTML(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmtDate(v){if(!v)return '—';try{return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch(e){return v}}
function textToHtml(v=''){return escapeHTML(v).split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('')}
function stripYamlValue(v=''){
  const t=String(v).trim();
  if((t.startsWith('"')&&t.endsWith('"'))||(t.startsWith("'")&&t.endsWith("'")))return t.slice(1,-1);
  return t;
}
function normalizeCategory(v='DOCUMENT'){
  const x=String(v||'').trim().toUpperCase();
  const map={세계:'WORLD',존재:'ENTITY',장소:'LOCATION',사건:'EVENT',물품:'OBJECT',조직:'ORGANIZATION',개념:'CONCEPT',현상:'PHENOMENON',문서:'DOCUMENT'};
  return categoryNames[x]?x:(map[String(v||'').trim()]||'DOCUMENT');
}
function normalizeStatus(v='incomplete'){
  const x=String(v||'').trim().toLowerCase();
  const map={'확인':'confirmed','관측 중':'observing','조사 중':'investigating','불완전':'incomplete','손상':'damaged','분실':'lost','논쟁 중':'disputed','봉인':'sealed'};
  return statusNames[x]?x:(map[String(v||'').trim()]||'incomplete');
}
function makeRedactionToken(){
  try{return crypto.randomUUID().replace(/-/g,'')}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
}
function extractRedactions(body=''){
  const redactions=[];
  const clean=String(body).replace(/\{\{redact:([\s\S]*?)\}\}/g,(full,inner)=>{
    const parts=String(inner).split('|').map(x=>x.trim()).filter(Boolean);
    const secret=(parts.shift()||'').trim();
    if(!secret)return full;
    let revealLevel=null,blockLength=6;
    for(const p of parts){
      const lm=p.match(/^level\s*=\s*([1-3])$/i);if(lm)revealLevel=Number(lm[1]);
      const bm=p.match(/^(?:blocks?|length)\s*=\s*(\d{1,2})$/i);if(bm)blockLength=Math.max(3,Math.min(24,Number(bm[1])));
      if(/^always$/i.test(p))revealLevel=null;
    }
    const token=makeRedactionToken();
    redactions.push({token,secret_text:secret,reveal_level:revealLevel,block_length:blockLength});
    return `{{redaction:${token}:${blockLength}}}`;
  });
  return {body:clean,redactions};
}
function parseArchiveMarkdown(text,fileName='record.md'){
  let src=String(text||'').replace(/\r\n?/g,'\n');
  const meta={};
  if(src.startsWith('---\n')){
    const end=src.indexOf('\n---\n',4);
    if(end>=0){
      const head=src.slice(4,end);
      src=src.slice(end+5);
      for(const line of head.split('\n')){
        if(!line.trim()||/^\s*#/.test(line))continue;
        const m=line.match(/^([A-Za-z_][A-Za-z0-9_-]*)\s*:\s*(.*)$/);
        if(m)meta[m[1].toLowerCase()]=stripYamlValue(m[2]);
      }
    }
  }
  const baseName=fileName.replace(/\.md$/i,'').trim()||'새 기록';
  const title=(meta.title||baseName).trim();
  const category=normalizeCategory(meta.category||'DOCUMENT');
  const status=normalizeStatus(meta.status||'incomplete');
  const accessRaw=String(meta.access||'public').toLowerCase();
  let level=Number(meta.level||meta.min_access_level||0)||0;
  let accessClass='public';
  if(accessRaw==='sealed'){accessClass='sealed';level=Math.max(level,3)}
  else if(accessRaw==='restricted'||level>0){accessClass='restricted';level=Math.max(1,level)}
  else {accessClass='public';level=0}
  level=Math.max(0,Math.min(3,level));
  const lines=src.split('\n');
  const rawSections=[];let heading='';let buf=[];
  const push=()=>{const body=buf.join('\n').trim();if(heading||body)rawSections.push({heading:heading||'개요',body});buf=[]};
  for(const line of lines){
    const m=line.match(/^#\s+(.+?)\s*$/);
    if(m){push();heading=m[1].trim();}
    else buf.push(line);
  }
  push();
  const sections=rawSections.filter(x=>x.body||x.heading).map((x,i)=>{
    const parsed=extractRedactions(x.body);
    return {heading:x.heading||`섹션 ${i+1}`,body:parsed.body,sort_order:(i+1)*10,min_access_level:level,redactions:parsed.redactions};
  });
  if(!sections.length)sections.push({heading:'개요',body:'',sort_order:10,min_access_level:level,redactions:[]});
  return {
    fileName,
    document:{archive_code:(meta.archive_code||meta.code||'').trim().toUpperCase()||null,title,title_en:(meta.title_en||'').trim()||null,category,access_class:accessClass,min_access_level:level,record_status:status,summary:(meta.summary||'').trim(),primary_world:(meta.world||meta.primary_world||'').trim()||null},
    sections
  };
}
function inlineMarkdown(v='',redactions=new Map()){
  let x=escapeHTML(v);
  x=x.replace(/\{\{redaction:([A-Za-z0-9_-]+):(\d{1,2})\}\}/g,(full,token,len)=>{
    const r=redactions.get(token);
    if(r)return `<span class="redaction-revealed" title="제한 ${escapeHTML(r.reveal_level)}급 검열 해제">${escapeHTML(r.secret_text)}</span>`;
    return `<span class="redaction-block" aria-label="검열됨">${'█'.repeat(Math.max(3,Math.min(24,Number(len)||6)))}</span>`;
  });
  x=x.replace(/`([^`]+)`/g,'<code>$1</code>');
  x=x.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  x=x.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g,'$1<em>$2</em>');
  return x;
}
function markdownToHtml(v='',redactions=new Map()){
  const lines=String(v||'').replace(/\r\n?/g,'\n').split('\n');
  let out='',para=[],list=[];
  const flushPara=()=>{if(para.length){out+=`<p>${para.map(x=>inlineMarkdown(x,redactions)).join('<br>')}</p>`;para=[]}};
  const flushList=()=>{if(list.length){out+='<ul>'+list.map(x=>`<li>${inlineMarkdown(x,redactions)}</li>`).join('')+'</ul>';list=[]}};
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(!line.trim()){flushPara();flushList();continue;}
    const h=line.match(/^(#{2,4})\s+(.+)$/);if(h){flushPara();flushList();const n=Math.min(4,h[1].length+1);out+=`<h${n}>${inlineMarkdown(h[2],redactions)}</h${n}>`;continue;}
    if(/^>\s?/.test(line)){
      flushPara();flushList();const q=[];
      while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,''));i++;}i--;
      out+=`<blockquote>${q.map(x=>inlineMarkdown(x,redactions)).join('<br>')}</blockquote>`;continue;
    }
    const li=line.match(/^[-*]\s+(.+)$/);if(li){flushPara();list.push(li[1]);continue;}
    flushList();para.push(line);
  }
  flushPara();flushList();return out;
}

function rpc(name,body={}){return rawFetch(`/rest/v1/rpc/${name}`,{method:'POST',body})}
function remainingTime(v){
  if(!v)return '무기한';
  const ms=new Date(v).getTime()-Date.now();
  if(ms<=0)return '만료됨';
  const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000);
  return `${h}시간 ${m}분`;
}
async function copyText(value){
  try{await navigator.clipboard.writeText(String(value||''));return true}catch(e){
    try{const ta=document.createElement('textarea');ta.value=String(value||'');document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();return true}catch(_){return false}
  }
}
function scheduleGuestExpiry(){
  if(guestExpiryTimer){clearTimeout(guestExpiryTimer);guestExpiryTimer=null;}
  if(state.member?.role!=='guest'||!state.member?.access_expires_at)return;
  const delay=new Date(state.member.access_expires_at).getTime()-Date.now();
  if(delay<=0){state.member=null;state.documents=[];showDenied();return;}
  guestExpiryTimer=setTimeout(()=>{state.member=null;state.documents=[];showDenied();},Math.min(delay+500,2147483647));
}

function stopPresence(){
  if(presenceTimer){clearInterval(presenceTimer);presenceTimer=null;}
}
function startPresence(){
  stopPresence();
  if(!state.session||!state.member)return;
  const beat=async()=>{
    if(!state.session||!state.member)return;
    try{await rpc('archive_presence_ping')}catch(e){console.warn('presence ping failed',e.message||e)}
  };
  beat();
  presenceTimer=setInterval(beat,30000);
}
function stopCommsPolling(){
  if(commsTimer){clearInterval(commsTimer);commsTimer=null;}
}

function setLoginStatus(msg,type=''){const el=$('#loginStatus');el.textContent=msg;el.className='status-msg '+type}
function saveSession(s){state.session=s;if(s)safeStore.set(SESSION_KEY,JSON.stringify(s));else safeStore.remove(SESSION_KEY)}
function normalizeSession(value){
  if(!value)return null;
  const s=value.currentSession||value.session||value;
  if(!s?.access_token||!s?.refresh_token)return null;
  return s;
}
function loadSession(){
  try{
    const own=safeStore.get(SESSION_KEY);
    if(own){const parsed=normalizeSession(JSON.parse(own));if(parsed)return parsed;}
    const aninote=safeStore.get(ANINOTE_SESSION_KEY);
    if(aninote){const parsed=normalizeSession(JSON.parse(aninote));if(parsed){safeStore.set(SESSION_KEY,JSON.stringify(parsed));return parsed;}}
  }catch(e){console.warn('session import failed',e)}
  return null;
}
async function rawFetch(path,{method='GET',body=null,auth=true,headers={}}={}){
  const h={'apikey':SUPABASE_KEY,'Content-Type':'application/json',...headers};
  if(auth&&state.session?.access_token)h['Authorization']='Bearer '+state.session.access_token;
  const res=await fetch(SUPABASE_URL+path,{method,headers:h,body:body===null?undefined:JSON.stringify(body)});
  let data=null;const txt=await res.text();if(txt){try{data=JSON.parse(txt)}catch(e){data=txt}}
  if(res.status===401&&auth&&state.session?.refresh_token){const ok=await refreshSession();if(ok)return rawFetch(path,{method,body,auth,headers});}
  if(!res.ok){const message=data?.message||data?.msg||data?.error_description||data?.hint||('HTTP '+res.status);const err=new Error(message);err.status=res.status;err.data=data;throw err}
  return data;
}
async function refreshSession(){
  try{const data=await rawFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:state.session.refresh_token},auth:false});saveSession(data);state.user=data.user||state.user;return true}catch(e){saveSession(null);return false}
}
async function signIn(email,password){
  const data=await rawFetch('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},auth:false});saveSession(data);state.user=data.user;return data
}
async function signOut(){
  stopPresence();stopCommsPolling();
  saveSession(null);state.user=null;state.member=null;state.documents=[];
  if(FROM_ANINOTE){location.href='index.html';return;}
  showLogin();
}
function restQuery(table,params=''){return rawFetch(`/rest/v1/${table}${params?'?'+params:''}`)}
async function restInsert(table,body,{returnRows=true}={}){return rawFetch(`/rest/v1/${table}`,{method:'POST',body,headers:{'Prefer':returnRows?'return=representation':'return=minimal'}})}
async function loadMember(){const rows=await restQuery('archive_members','select=user_id,role,access_level,member_code,call_sign,is_active,invited_by,access_expires_at,created_at');state.member=Array.isArray(rows)?rows[0]:null;scheduleGuestExpiry();return state.member}
async function redeemInvite(code){return rawFetch('/rest/v1/rpc/redeem_archive_invite',{method:'POST',body:{invite_code:code}})}
async function loadDocuments(){state.documents=await restQuery('archive_documents','select=id,archive_code,title,title_en,category,access_class,min_access_level,record_status,summary,primary_world,created_at,updated_at&order=updated_at.desc');return state.documents}
async function bootstrap(){
  try{state.session=loadSession();if(!state.session)return showLogin();state.user=state.session.user||null;$('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden');$('#view').innerHTML='<div class="loading">기록망 동기화 중...</div>';await loadMember();if(!state.member){return showDenied()}await loadDocuments();applyMemberUI();renderHome()}catch(e){console.error(e);saveSession(null);showLogin();setLoginStatus('세션을 복구하지 못했습니다. 다시 로그인해주세요.','error')}
}
function showLogin(){stopPresence();stopCommsPolling();$('#app').classList.add('hidden');$('#loginScreen').classList.remove('hidden');setLoginStatus('')}
function showDenied(){
  stopPresence();stopCommsPolling();
  $('#loginScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');

async function loadOnlineMembers(){
  try{return await rpc('archive_online_members')}catch(e){console.warn('online members failed',e);return []}
}
async function loadArchiveChat(){
  try{
    const rows=await restQuery('archive_chat_messages','select=id,sender_code,body,created_at&order=created_at.desc&limit=100');
    return Array.isArray(rows)?rows.reverse():[];
  }catch(e){console.warn('archive chat failed',e);return []}
}
function onlineRoleText(row){
  const base=roleNames[row.role]||row.role;
  if(row.role==='archivist')return `${base} · ${row.access_level}급`;
  if(row.role==='chief')return `${base} · 3급`;
  return base;
}
function paintOnlineMembers(rows){
  const box=$('#onlineMembers');if(!box)return;
  const count=$('#onlineCount');if(count)count.textContent=String(rows.length);
  box.innerHTML=rows.length?rows.map(x=>{
    const mine=x.member_code===state.member?.member_code;
    return `<div class="online-member"><div class="online-code ${mine?'online-me':''}">${escapeHTML(x.member_code)}${mine?' · YOU':''}<span class="role-chip-small">${escapeHTML(onlineRoleText(x))}</span></div><div class="online-meta">최근 신호 ${escapeHTML(fmtDate(x.last_seen))}</div></div>`;
  }).join(''):'<div class="empty-small">현재 확인되는 접속자가 없습니다.</div>';
}
function paintArchiveChat(rows,forceBottom=false){
  const box=$('#archiveChat');if(!box)return;
  const oldHeight=box.scrollHeight, oldTop=box.scrollTop, oldClient=box.clientHeight;
  const bottomGap=Math.max(0,oldHeight-oldTop-oldClient);
  const stick=forceBottom||bottomGap<90||oldHeight===0;
  box.innerHTML=rows.length?rows.map(m=>{
    const mine=m.sender_code===state.member?.member_code;
    return `<div class="archive-chat-msg ${mine?'mine':''}"><div class="archive-chat-who">${escapeHTML(m.sender_code)}${mine?' · YOU':''}</div><div class="archive-chat-body">${escapeHTML(m.body)}</div><div class="archive-chat-time">${escapeHTML(fmtDate(m.created_at))}</div></div>`;
  }).join(''):'<div class="empty-small">아직 통신 기록이 없습니다.</div>';
  requestAnimationFrame(()=>{
    if(stick)box.scrollTop=box.scrollHeight;
    else box.scrollTop=Math.max(0,box.scrollHeight-box.clientHeight-bottomGap);
  });
}
async function refreshComms(forceBottom=false){
  if(state.route!=='comms')return;
  const [online,messages]=await Promise.all([loadOnlineMembers(),loadArchiveChat()]);
  if(state.route!=='comms')return;
  paintOnlineMembers(online||[]);
  paintArchiveChat(messages||[],forceBottom);
}
async function sendArchiveChat(){
  const input=$('#archiveChatInput'),st=$('#archiveChatStatus');
  if(!input)return;
  const body=input.value.trim();
  if(!body)return;
  if(body.length>1000){if(st)st.textContent='메시지는 1000자까지 작성할 수 있습니다.';return;}
  const btn=$('#archiveChatSend');if(btn)btn.disabled=true;
  if(st){st.textContent='전송 중...';st.className='status-msg';}
  try{
    await restInsert('archive_chat_messages',{body},{returnRows:false});
    input.value='';
    if(st){st.textContent='';st.className='status-msg';}
    await refreshComms(true);
  }catch(e){if(st){st.textContent=e.message;st.className='status-msg error';}}
  finally{if(btn)btn.disabled=false;input.focus();}
}

  const dz=$('#mdDropzone'),fi=$('#mdFileInput');
  dz.onclick=()=>fi.click();
  fi.onchange=()=>{if(fi.files?.[0])loadMarkdownFile(fi.files[0])};
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag')};dz.ondragleave=()=>dz.classList.remove('drag');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');const f=e.dataTransfer?.files?.[0];if(f)loadMarkdownFile(f)};
}
async function loadMarkdownFile(file){
  const st=$('#mdLoadStatus');st.textContent='MD 분석 중...';st.className='status-msg';
  try{
    if(!file.name.toLowerCase().endsWith('.md'))throw new Error('.md 파일만 가져올 수 있습니다.');
    if(file.size>2*1024*1024)throw new Error('MD 파일은 2MB 이하만 가져올 수 있습니다.');
    const text=await file.text();
    const draft=parseArchiveMarkdown(text,file.name);
    if(draft.document.min_access_level>state.member.access_level)throw new Error(`이 문서는 ${draft.document.min_access_level}급으로 설정되어 있지만 현재 계정 권한보다 높습니다.`);
    state.mdDraft=draft;st.textContent='분석 완료';st.className='status-msg ok';
    $('#mdFileChip').innerHTML=`<span class="file-chip">${escapeHTML(file.name)} · ${(file.size/1024).toFixed(1)} KB</span>`;
    renderMarkdownPreview();
  }catch(e){state.mdDraft=null;st.textContent=e.message||'MD 분석에 실패했습니다.';st.className='status-msg error';$('#mdPreview').classList.add('hidden')}
}
function renderMarkdownPreview(){
  const d=state.mdDraft;if(!d)return;
  const doc=d.document,totalRedactions=d.sections.reduce((n,s)=>n+(s.redactions?.length||0),0);
  const accessOptions=[`<option value="public:0" ${doc.access_class==='public'?'selected':''}>공개</option>`]
    .concat([1,2,3].filter(n=>n<=state.member.access_level).map(n=>`<option value="restricted:${n}" ${doc.access_class==='restricted'&&doc.min_access_level===n?'selected':''}>제한 ${n}급</option>`))
    .concat(state.member.role==='chief'?[`<option value="sealed:3" ${doc.access_class==='sealed'?'selected':''}>봉인 · 3급</option>`]:[]).join('');
  $('#mdPreview').classList.remove('hidden');
  $('#mdPreview').innerHTML=`<div class="notice-box"><b>분석 결과</b> · 기록 ID는 비워두면 서버에서 분류에 맞는 다음 번호를 자동 발급합니다.</div>
    <div class="field-grid" style="margin-top:14px">
      <div><label class="field-label">분류</label><select id="mdCategory" class="control">${Object.entries(categoryNames).map(([k,v])=>`<option value="${k}" ${doc.category===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div><label class="field-label">기록 ID</label><input id="mdArchiveCode" class="control mono" value="${escapeHTML(doc.archive_code||'')}" placeholder="자동 발급" /></div>
      <div><label class="field-label">제목</label><input id="mdTitle" class="control" value="${escapeHTML(doc.title)}" /></div>
      <div><label class="field-label">영문/보조 제목</label><input id="mdTitleEn" class="control" value="${escapeHTML(doc.title_en||'')}" /></div>
      <div><label class="field-label">열람 등급</label><select id="mdAccess" class="control">${accessOptions}</select></div>
      <div><label class="field-label">상태</label><select id="mdStatus" class="control">${Object.entries(statusNames).map(([k,v])=>`<option value="${k}" ${doc.record_status===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="full"><label class="field-label">관련 세계</label><input id="mdWorld" class="control" value="${escapeHTML(doc.primary_world||'')}" /></div>
      <div class="full"><label class="field-label">요약</label><textarea id="mdSummary" class="control" rows="3">${escapeHTML(doc.summary||'')}</textarea></div>
    </div>
    <div class="md-section-list"><div class="md-section-row"><b>섹션</b><b>${d.sections.length}개 · 검열 ${totalRedactions}개</b></div>${d.sections.map(s=>`<div class="md-section-row"><span>${escapeHTML(s.heading)}</span><span class="muted">${s.body.length.toLocaleString()}자${s.redactions?.length?` · 검열 ${s.redactions.length}`:''}</span></div>`).join('')}</div>
    <div class="md-redaction-note"><b>검열 문법</b><br><code>{{redact:비밀정보}}</code> → 모든 열람자에게 항상 ██████<br><code>{{redact:비밀정보|level=2}}</code> → 2급 이상 기록관에게만 원문 표시. 실제 비밀값은 공개 본문과 분리되어 저장됩니다.</div>
    <div id="mdImportStatus" class="status-msg"></div><div class="toolbar-row end"><button id="clearMdDraft" class="small-btn" type="button">다른 파일 선택</button><button id="importMdBtn" class="primary-inline" type="button">MD 기록 등록</button></div>`;
  $('#clearMdDraft').onclick=()=>{state.mdDraft=null;$('#mdPreview').classList.add('hidden');$('#mdFileChip').innerHTML='';$('#mdFileInput').value='';$('#mdLoadStatus').textContent=''};
  $('#importMdBtn').onclick=importMarkdownDraft;
}
async function importMarkdownDraft(){
  const draft=state.mdDraft,st=$('#mdImportStatus');if(!draft||!st)return;
  const [accessClass,levelRaw]=$('#mdAccess').value.split(':');
  const document={...draft.document,archive_code:$('#mdArchiveCode').value.trim().toUpperCase()||null,title:$('#mdTitle').value.trim(),title_en:$('#mdTitleEn').value.trim()||null,category:$('#mdCategory').value,access_class:accessClass,min_access_level:Number(levelRaw),record_status:$('#mdStatus').value,summary:$('#mdSummary').value.trim(),primary_world:$('#mdWorld').value.trim()||null};
  if(!document.title){st.textContent='제목이 필요합니다.';st.className='status-msg error';return;}
  const sections=draft.sections.map(s=>({...s,min_access_level:Math.max(Number(levelRaw),Number(s.min_access_level||0))}));
  const btn=$('#importMdBtn');btn.disabled=true;st.textContent='기록망에 MD 등록 중...';st.className='status-msg';
  try{
    const result=await rpc('import_archive_markdown',{p_document:document,p_sections:sections});
    if(!result?.ok)throw new Error('MD 등록 결과를 확인할 수 없습니다.');
    st.textContent=`등록 완료 · ${result.archive_code} · 섹션 ${result.section_count}개 · 검열 ${result.redaction_count}개`;st.className='status-msg ok';
    await loadDocuments();setTimeout(()=>openDocument(result.document_id),350);
  }catch(e){st.textContent=e.message||'MD 등록에 실패했습니다.';st.className='status-msg error'}finally{btn.disabled=false}
}

async function updateSuggestedCode(){const cat=$('#docCategory')?.value;if(!cat)return;try{const codes=await restQuery('archive_documents',`select=archive_code&category=eq.${encodeURIComponent(cat)}`);const prefix=`PA-${categoryPrefixes[cat]}-`;let max=0;(codes||[]).forEach(x=>{const m=String(x.archive_code).match(/(\d{4})$/);if(m)max=Math.max(max,Number(m[1]))});$('#docCode').value=prefix+String(max+1).padStart(4,'0')}catch(e){$('#docCode').value=`PA-${categoryPrefixes[cat]}-0001`}}
async function createDocument(e){e.preventDefault();const st=$('#createStatus');st.textContent='기록 등록 중...';st.className='status-msg';const level=Number($('#docLevel').value);const payload={archive_code:$('#docCode').value.trim().toUpperCase(),title:$('#docTitle').value.trim(),title_en:$('#docTitleEn').value.trim()||null,category:$('#docCategory').value,access_class:level===0?'public':'restricted',min_access_level:level,record_status:$('#docStatus').value,summary:$('#docSummary').value.trim(),primary_world:$('#docWorld').value.trim()||null};try{const rows=await restInsert('archive_documents',payload);const d=rows[0];const body=$('#docBody').value.trim();if(body)await restInsert('archive_document_sections',{document_id:d.id,heading:'개요',body,sort_order:10,min_access_level:level});await restInsert('archive_document_revisions',{document_id:d.id,change_summary:'문서 생성',snapshot:payload});await loadDocuments();st.textContent='등록 완료';st.className='status-msg ok';setTimeout(()=>openDocument(d.id),250)}catch(err){st.textContent=err.message;st.className='status-msg error'}}
async function syncNow(){const btn=$('#refreshBtn');btn.textContent='동기화 중…';try{await loadMember();if(!state.member)return showDenied();await loadDocuments();applyMemberUI();renderHome()}catch(e){alert('동기화 실패: '+e.message)}finally{btn.textContent='동기화'}}
function route(name){if(name!=='comms')stopCommsPolling();state.route=name;$$('.nav-item').forEach(x=>x.classList.remove('active'));const active=document.querySelector(`[data-route="${name}"]`);if(active)active.classList.add('active');if(name==='home')renderHome();else if(name==='recent')renderRecent();else if(name==='random'){if(state.documents.length)openDocument(state.documents[Math.floor(Math.random()*state.documents.length)].id);else renderHome()}else if(name==='create')renderCreate();else if(name==='comms')renderComms()}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();if(state.busy)return;state.busy=true;$('#loginBtn').disabled=true;setLoginStatus('계정 인증 중...');try{await signIn($('#email').value.trim(),$('#password').value);await loadMember();if(!state.member){showDenied();return}await loadDocuments();$('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden');applyMemberUI();renderHome()}catch(err){console.error(err);saveSession(null);setLoginStatus(err.message||'로그인에 실패했습니다.','error')}finally{state.busy=false;$('#loginBtn').disabled=false}});
$$('[data-route]').forEach(b=>b.addEventListener('click',()=>route(b.dataset.route)));$$('[data-category]').forEach(b=>b.addEventListener('click',()=>renderCategory(b.dataset.category)));$('#profileBtn').onclick=renderProfile;$('#logoutBtn').onclick=signOut;$('#refreshBtn').onclick=syncNow;
window.addEventListener('unhandledrejection',e=>console.error('PLANK UNHANDLED',e.reason));bootstrap();
</script>
</body></html>
