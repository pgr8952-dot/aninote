<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>울산대 뭐먹지 Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17191d;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{height:64px;display:flex;align-items:center;padding:0 16px;background:#fff;border-bottom:1px solid #e2e6ea;position:sticky;top:0;z-index:20}header b{flex:1}.btn{border:0;background:#111827;color:#fff;border-radius:12px;padding:10px 13px;font-weight:850}.ghost{background:#fff;color:#111827;border:1px solid #dfe3e8}
.wrap{max-width:1120px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e1e5e9;border-radius:17px;padding:14px;margin-bottom:12px}.layout{display:grid;grid-template-columns:290px 1fr;gap:12px}.item{width:100%;border:1px solid #e0e4e8;background:#fff;border-radius:12px;padding:10px;text-align:left;margin:6px 0}.item.on{border-color:#111827;box-shadow:0 0 0 1px #111827 inset}.muted{font-size:12px;color:#737b85;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:11px;font-weight:850;color:#747b85;margin:9px 0 4px}input,select,textarea{width:100%;border:1px solid #dfe3e8;border-radius:10px;padding:9px}textarea{min-height:80px}#map{height:360px;background:#dce2e7;border-radius:14px}.row{display:grid;grid-template-columns:1fr 120px 70px 38px;gap:7px;margin:7px 0}.x{border:1px solid #e1e4e8;background:#fff;border-radius:8px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.notice{background:#fff4cf;color:#665000;line-height:1.55}.tabs{display:flex;gap:7px;margin:10px 0}.tab{flex:1;border:1px solid #dfe3e8;background:#fff;border-radius:11px;padding:10px;font-weight:850}.tab.on{background:#111827;color:white;border-color:#111827}.headrow{display:flex;gap:7px;align-items:center}.headrow b{flex:1}
@media(max-width:760px){.layout,.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 90px 64px 38px}#map{height:280px}}
</style></head>
<body>
<header><b>🛠 울산대 뭐먹지 Editor</b><button class="btn ghost" onclick="location.href='food.html'">사용자 화면</button></header>
<div class="wrap">
 <div class="card"><b>공유 지도 설정</b><div class="muted" style="margin-top:5px">카카오 JavaScript 키는 한 번만 저장하면 돼.</div>
  <div class="grid"><div><label>카카오 JavaScript 키</label><input id="jskey" type="password" placeholder="JavaScript 키"></div><div style="align-self:end"><button class="btn" id="saveKey" style="width:100%">공유 키 저장</button></div></div><div id="keyStatus" class="muted" style="margin-top:8px"></div>
 </div>
 <div class="card notice"><b>카카오 JavaScript SDK 도메인 등록값</b><br><span id="origin"></span></div>
 <div class="layout">
  <aside class="card">
   <div class="tabs"><button class="tab on" data-tab="restaurant">🍴 식당</button><button class="tab" data-tab="vending">🥤 자판기</button></div>
   <div class="headrow"><b id="listTitle">등록 식당</b><button class="btn" id="newItem">+ 추가</button></div>
   <div id="items"></div>
  </aside>
  <main class="card">
   <div id="empty" class="muted">왼쪽에서 항목을 선택하거나 새로 추가해줘.</div>

   <div id="restaurantForm" style="display:none">
    <div class="grid">
     <div><label>이름</label><input id="name"></div><div><label>종류</label><select id="cat"><option>한식</option><option>일식</option><option>중식</option><option>양식</option><option>분식</option><option>패스트푸드</option><option>기타</option></select></div>
     <div><label>주소</label><input id="address"></div><div><label>전화</label><input id="phone"></div>
     <div><label>최소 가격</label><input id="minp" type="number"></div><div><label>평균 가격</label><input id="avgp" type="number"></div>
     <div><label>최대 가격</label><input id="maxp" type="number"></div><div><label>평점(TEST)</label><input id="rating" type="number" step=".1"></div>
     <div><label>테이블 수</label><input id="tables" type="number"></div><div><label>수용 인원</label><input id="capacity" type="number"></div>
    </div>
    <label>설명</label><textarea id="desc"></textarea>
    <div style="display:flex;gap:14px;flex-wrap:wrap"><label><input id="solo" type="checkbox" style="width:auto"> 혼밥 가능</label><label><input id="group" type="checkbox" style="width:auto"> 단체 가능</label><label><input id="takeout" type="checkbox" style="width:auto"> 포장 가능</label></div>
    <div class="grid"><div><label>오픈</label><input id="open" type="time"></div><div><label>마감</label><input id="close" type="time"></div><div><label>브레이크 시작</label><input id="bs" type="time"></div><div><label>브레이크 종료</label><input id="be" type="time"></div><div><label>라스트오더</label><input id="last" type="time"></div></div>
    <label>메뉴</label><div id="menus"></div><button class="btn ghost" id="addMenu">+ 메뉴</button>
   </div>

   <div id="vendingForm" style="display:none">
    <div class="grid"><div><label>자판기 이름</label><input id="vname" placeholder="예: 생활과학관 1층 자판기"></div><div><label>설명</label><input id="vdesc" placeholder="예: 음료 / 카드 가능"></div></div>
   </div>

   <div id="locationBlock" style="display:none">
    <div style="height:10px"></div><div id="map"></div>
    <div class="grid"><div><label>위도</label><input id="lat" type="number" step=".000001"></div><div><label>경도</label><input id="lng" type="number" step=".000001"></div></div>
    <div class="muted" style="margin-top:6px">지도에서 클릭하거나 핀을 드래그해서 위치를 정할 수 있어.</div>
    <div class="actions"><button class="btn ghost" id="del">삭제</button><button class="btn" id="save">Supabase에 저장</button></div>
   </div>
  </main>
 </div>
</div>
<script>
const SB="https://wlajrtchyadaxojzrxjg.supabase.co",PK="sb_publishable_ylGYWgn577t8gTeRWgqUGA_mwJwo9xC",S={lat:35.5439,lng:129.2563};let mode="restaurant",restaurants=[],vending=[],sel=null,menus=[],map=null,marker=null;const $=q=>document.querySelector(q);
async function api(p,o={}){const r=await fetch(SB+"/rest/v1/"+p,{...o,headers:{apikey:PK,"content-type":"application/json",Prefer:"return=representation",...(o.headers||{})}});if(!r.ok)throw Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function t5(v){return(v||"").slice(0,5)}
async function settings(){const a=await api("food_app_settings?id=eq.main&select=*");$("#keyStatus").textContent=a[0]?.kakao_js_key?"공유 키 저장됨 ✅":"아직 공유 키 없음";return a[0]?.kakao_js_key||""}
$("#origin").textContent=location.origin;
$("#saveKey").onclick=async()=>{const k=$("#jskey").value.trim();if(!k)return alert("JavaScript 키를 입력해줘.");await api("food_app_settings?id=eq.main",{method:"PATCH",body:JSON.stringify({kakao_js_key:k,updated_at:new Date().toISOString()})});alert("저장 완료");location.reload()}
function initMap(key){if(!key)return;const s=document.createElement("script");s.src="https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey="+encodeURIComponent(key);s.onload=()=>kakao.maps.load(()=>{map=new kakao.maps.Map($("#map"),{center:new kakao.maps.LatLng(S.lat,S.lng),level:3});marker=new kakao.maps.Marker({map,position:new kakao.maps.LatLng(S.lat,S.lng),draggable:true});kakao.maps.event.addListener(map,"click",e=>setPos(e.latLng.getLat(),e.latLng.getLng()));kakao.maps.event.addListener(marker,"dragend",()=>{const p=marker.getPosition();setPos(p.getLat(),p.getLng(),false)})});document.head.appendChild(s)}
function setPos(a,b,m=true){$("#lat").value=(+a).toFixed(6);$("#lng").value=(+b).toFixed(6);if(map&&marker&&m){const p=new kakao.maps.LatLng(+a,+b);marker.setPosition(p);map.panTo(p)}}
async function loadAll(){[restaurants,vending]=await Promise.all([api("food_restaurants?select=*&is_demo=eq.true&order=name.asc"),api("food_vending_machines?select=*&order=name.asc")]);renderList()}
function renderList(){const arr=mode==="restaurant"?restaurants:vending;$("#listTitle").textContent=mode==="restaurant"?"등록 식당":"등록 자판기";$("#items").innerHTML=arr.map(r=>`<button class="item ${sel?.id===r.id?"on":""}" data-id="${r.id}"><b>${mode==="restaurant"?"🍴 ":"🥤 "}${esc(r.name)}</b><div class="muted">${mode==="restaurant"?esc(r.category_label||"기타"):esc(r.description||"설명 없음")}</div></button>`).join("")||'<div class="muted" style="padding:10px 2px">아직 등록된 항목 없음</div>'}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{mode=b.dataset.tab;sel=null;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));$("#restaurantForm").style.display="none";$("#vendingForm").style.display="none";$("#locationBlock").style.display="none";$("#empty").style.display="block";renderList()})
$("#items").onclick=e=>{const b=e.target.closest(".item");if(b)openItem(b.dataset.id)}
async function openItem(id){if(mode==="restaurant")await openRestaurant(id);else openVending(id);renderList()}
async function openRestaurant(id){sel=restaurants.find(x=>x.id===id);if(!sel)return;$("#empty").style.display="none";$("#restaurantForm").style.display="block";$("#vendingForm").style.display="none";$("#locationBlock").style.display="block";$("#name").value=sel.name||"";$("#cat").value=sel.category_label||"기타";$("#address").value=sel.address||"";$("#phone").value=sel.phone||"";$("#desc").value=sel.description||"";$("#minp").value=sel.min_price??"";$("#avgp").value=sel.average_price??"";$("#maxp").value=sel.max_price??"";$("#rating").value=sel.demo_rating??"";$("#tables").value=sel.table_count??"";$("#capacity").value=sel.capacity??"";$("#solo").checked=!!sel.solo_friendly;$("#group").checked=!!sel.group_friendly;$("#takeout").checked=!!sel.takeout;$("#last").value=t5(sel.last_order_time);setPos(sel.latitude,sel.longitude);setTimeout(()=>map?.relayout(),80);const [ms,hs]=await Promise.all([api("food_menus?select=*&restaurant_id=eq."+id+"&order=sort_order.asc"),api("food_restaurant_hours?select=*&restaurant_id=eq."+id+"&order=weekday.asc")]);menus=ms.map(x=>({name:x.name,price:x.price,is_signature:x.is_signature}));renderMenus();const h=hs[0];$("#open").value=t5(h?.open_time);$("#close").value=t5(h?.close_time);$("#bs").value=t5(h?.break_start);$("#be").value=t5(h?.break_end)}
function openVending(id){sel=vending.find(x=>x.id===id);if(!sel)return;$("#empty").style.display="none";$("#restaurantForm").style.display="none";$("#vendingForm").style.display="block";$("#locationBlock").style.display="block";$("#vname").value=sel.name||"자판기";$("#vdesc").value=sel.description||"";setPos(sel.latitude,sel.longitude);setTimeout(()=>map?.relayout(),80)}
function renderMenus(){$("#menus").innerHTML=menus.map((m,i)=>`<div class="row"><input data-i="${i}" data-k="name" value="${esc(m.name)}"><input data-i="${i}" data-k="price" type="number" value="${m.price}"><label><input data-i="${i}" data-k="sig" type="checkbox" ${m.is_signature?"checked":""} style="width:auto"> 대표</label><button class="x" data-x="${i}">×</button></div>`).join("")}
$("#menus").oninput=e=>{const i=+e.target.dataset.i,k=e.target.dataset.k;if(k==="name")menus[i].name=e.target.value;if(k==="price")menus[i].price=+e.target.value}
$("#menus").onchange=e=>{if(e.target.dataset.k==="sig")menus[+e.target.dataset.i].is_signature=e.target.checked}
$("#menus").onclick=e=>{const b=e.target.closest("[data-x]");if(b){menus.splice(+b.dataset.x,1);renderMenus()}}
$("#addMenu").onclick=()=>{menus.push({name:"새 메뉴",price:8000,is_signature:menus.length===0});renderMenus()}
$("#newItem").onclick=()=>{$("#empty").style.display="none";$("#locationBlock").style.display="block";if(mode==="restaurant"){sel={id:null,demo_slug:"demo-"+Date.now(),latitude:S.lat,longitude:S.lng};$("#restaurantForm").style.display="block";$("#vendingForm").style.display="none";$("#name").value="새 식당";$("#cat").value="한식";$("#address").value="울산대학교 주변";$("#phone").value="";$("#desc").value="";$("#minp").value=7000;$("#avgp").value=9000;$("#maxp").value=12000;$("#rating").value=4;$("#tables").value=8;$("#capacity").value=24;$("#solo").checked=true;$("#group").checked=true;$("#takeout").checked=true;menus=[{name:"대표 메뉴",price:9000,is_signature:true}];renderMenus();$("#open").value="11:00";$("#close").value="21:00";$("#bs").value="";$("#be").value="";$("#last").value="20:30"}else{sel={id:null,latitude:S.lat,longitude:S.lng};$("#restaurantForm").style.display="none";$("#vendingForm").style.display="block";$("#vname").value="자판기";$("#vdesc").value=""}setPos(S.lat,S.lng);setTimeout(()=>map?.relayout(),80)}
function restaurantPayload(){return{name:$("#name").value.trim(),category_label:$("#cat").value,address:$("#address").value.trim(),phone:$("#phone").value.trim()||null,description:$("#desc").value.trim()||null,min_price:+$("#minp").value||null,average_price:+$("#avgp").value||null,max_price:+$("#maxp").value||null,demo_rating:+$("#rating").value||null,table_count:+$("#tables").value||null,capacity:+$("#capacity").value||null,solo_friendly:$("#solo").checked,group_friendly:$("#group").checked,takeout:$("#takeout").checked,delivery:false,latitude:+$("#lat").value,longitude:+$("#lng").value,last_order_time:$("#last").value||null,is_active:true,is_demo:true,demo_slug:sel.demo_slug||("demo-"+Date.now()),updated_at:new Date().toISOString()}}
$("#save").onclick=async()=>{if(mode==="restaurant")await saveRestaurant();else await saveVending();await loadAll();renderList()}
async function saveRestaurant(){let id=sel.id,p=restaurantPayload();if(id){const a=await api("food_restaurants?id=eq."+id,{method:"PATCH",body:JSON.stringify(p)});sel=a[0]||{...sel,...p}}else{const a=await api("food_restaurants",{method:"POST",body:JSON.stringify(p)});sel=a[0];id=sel.id}await api("food_menus?restaurant_id=eq."+id,{method:"DELETE"});if(menus.length)await api("food_menus",{method:"POST",body:JSON.stringify(menus.map((m,i)=>({restaurant_id:id,name:m.name,price:+m.price||0,is_signature:!!m.is_signature,is_available:true,sort_order:i+1})))});await api("food_restaurant_hours?restaurant_id=eq."+id,{method:"DELETE"});await api("food_restaurant_hours",{method:"POST",body:JSON.stringify([0,1,2,3,4,5,6].map(d=>({restaurant_id:id,weekday:d,open_time:$("#open").value||null,close_time:$("#close").value||null,break_start:$("#bs").value||null,break_end:$("#be").value||null,is_closed:false})))});alert("식당 저장 완료")}
async function saveVending(){const p={name:$("#vname").value.trim()||"자판기",description:$("#vdesc").value.trim()||null,latitude:+$("#lat").value,longitude:+$("#lng").value,is_active:true,updated_at:new Date().toISOString()};if(sel.id){const a=await api("food_vending_machines?id=eq."+sel.id,{method:"PATCH",body:JSON.stringify(p)});sel=a[0]||{...sel,...p}}else{const a=await api("food_vending_machines",{method:"POST",body:JSON.stringify(p)});sel=a[0]}alert("자판기 저장 완료")}
$("#del").onclick=async()=>{if(!sel?.id)return;if(!confirm("삭제할까?"))return;if(mode==="restaurant"){await api("food_menus?restaurant_id=eq."+sel.id,{method:"DELETE"});await api("food_restaurant_hours?restaurant_id=eq."+sel.id,{method:"DELETE"});await api("food_restaurants?id=eq."+sel.id,{method:"DELETE"})}else await api("food_vending_machines?id=eq."+sel.id,{method:"DELETE"});sel=null;$("#restaurantForm").style.display="none";$("#vendingForm").style.display="none";$("#locationBlock").style.display="none";$("#empty").style.display="block";await loadAll()}
$("#lat").onchange=()=>setPos(+$("#lat").value,+$("#lng").value);$("#lng").onchange=()=>setPos(+$("#lat").value,+$("#lng").value);
(async()=>{const [_,key]=await Promise.all([loadAll(),settings()]);initMap(key)})();
</script></body></html>
